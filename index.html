<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>✋</title>
    <style>
        :root {
            --bg: #EBD9D1;
            --cell: #EBD9D1;
            --txt: #B87C4C;
            --border: #A8BBA3;
            --green: #67C090;
            --yellow: #FEB21A;
            --gray: #6b7280
        }

        body {
            background: var(--bg);
            color: var(--txt);
            font-family: Inter, system-ui, Segoe UI, Arial;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        .app {
            width: 360px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 20px;
            text-align: center
        }

        #grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 8px
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .cell {
            height: 48px;
            width: 48px;

            background: var(--cell);
            border: 2px solid var(--border);
            display: flex;
            font-weight: 700;
            font-size: 22px;
            border-radius: 6px
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: center
        }

        button {
            padding: 8px 12px;
            border-radius: 8px;
            border: 0;
            background: var(--cell);
            border: 1px solid var(--txt);
            color: var(--txt);
            cursor: pointer
        }


        .keyboard-layer {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 0;
        }

        .key {
            padding: 8px;
            border-radius: 6px;
            background: var(--cell);
            text-align: center;
            cursor: pointer;
            user-select: none;
            border: 1px solid var(--border);
        }

        .status {
            margin-top: 10px;
            text-align: center;
            color: var(--bg)
        }

        .hint {
            font-size: 13px;
            color: var(--cell);
            text-align: center;
            margin-top: 6px
        }

        .green {
            background: var(--green) !important;
            color: white
        }

        .yellow {
            background: var(--yellow) !important;
            color: white
        }

        .dark {
            background: var(--gray) !important;
            color: white
        }

        footer {
            margin-top: 10px;
            font-size: 12px;
            color: var(--cell);
            text-align: center
        }

        .datilologia {
            width: 32px;
            height: 32px;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>
            <img class="datilologia" src="assets/t.png" alt="">
            <img class="datilologia" src="assets/e.png" alt="">
            <img class="datilologia" src="assets/r.png" alt="">
            <img class="datilologia" src="assets/m.png" alt="">
            <img class="datilologia" src="assets/o.png" alt="">
            <img class="datilologia" src="assets/o.png" alt="">
            <img class="datilologia" src="assets/o.png" alt="">
        </h1>
        <div id="grid"></div>
        <div class="controls">
            <button id="btn-backspace">⌫</button>
            <button id="btn-submit">➥</button>
        </div>
        <div class="keyboard" id="keyboard">
            <div class="keyboard-layer" id="keyboard-top"></div>
            <div class="keyboard-layer" id="keyboard-mid"></div>
            <div class="keyboard-layer" id="keyboard-low"></div>
        </div>
        <!-- <div class="status" id="status">Tente adivinhar a palavra em 6 tentativas.</div> -->
        <!-- <div class="hint">Ative o botão de LIBRAS (VLibras) no canto para tradução em Libras.</div> -->
        <footer>Versão com palavra do dia</footer>
    </div>

    <script>

        const imageSize = 48;
        const ratio = 0.35;

        /* === Lista de palavras (somente 5 letras, sem acento) === */
        const WORDS = [
            // "livro",
            "casal",
            "ratos",
            // "vista",
            // "tempo",
            // "sonho",
            // "cerca",
            // "papel",
            // "jogar",
            // "chute",
            // "torre",
            // "linha",
            // "banco",
            // "ficar",
            // "termo",
            // "ninho",
            // "grato",
            // "rumor",
            // "plano",
            // "crise"
        ];

        /* Função para obter palavra do dia com base na data */
        function getWordOfDay() {
            const start = new Date(2025, 0, 1); // base
            const today = new Date();
            const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
            return WORDS[diff % WORDS.length];
        }
        let TARGET = getWordOfDay();
        console.log({ TARGET })

        const MAX_ROWS = 6, COLS = 5;
        const gridEl = document.getElementById('grid');
        const statusEl = document.getElementById('status');
        const keyboardTop = document.getElementById('keyboard-top');
        const keyboardMid = document.getElementById('keyboard-mid');
        const keyboardLow = document.getElementById('keyboard-low');
        let row = 0, col = 0;
        const board = Array.from({ length: MAX_ROWS }, () => Array(COLS).fill(''));

        /* --- montar grid --- */
        for (let r = 0; r < MAX_ROWS; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r; cell.dataset.c = c;
                rowDiv.appendChild(cell);
            }
            gridEl.appendChild(rowDiv);
        }

        /* teclado on-screen */
        const lettersTop = "qwertyuiop";
        lettersTop.split('').forEach(l => {
            const k = document.createElement('img');
            k.className = 'key';
            k.src = `assets/${l}.png`;
            k.width = imageSize * ratio;
            k.height = imageSize * ratio;
            k.addEventListener('click', () => pressLetter(l));
            keyboardTop.appendChild(k);
        });

        const lettersMid = "asdfghjkl";
        lettersMid.split('').forEach(l => {
            const k = document.createElement('img');
            k.className = 'key';
            k.src = `assets/${l}.png`;
            k.width = imageSize * ratio;
            k.height = imageSize * ratio;
            k.addEventListener('click', () => pressLetter(l));
            keyboardMid.appendChild(k);
        });
        const lettersLow = "zxcvbnm";
        lettersLow.split('').forEach(l => {
            const k = document.createElement('img');
            k.className = 'key';
            k.src = `assets/${l}.png`;
            k.width = imageSize * ratio;
            k.height = imageSize * ratio;
            k.addEventListener('click', () => pressLetter(l));
            keyboardLow.appendChild(k);
        });

        document.getElementById('btn-backspace').onclick = backspace;
        document.getElementById('btn-submit').onclick = submit;

        document.addEventListener('keydown', (e) => {
            if (e.key === "Enter") submit();
            else if (e.key === "Backspace") backspace();
            else {
                const k = e.key.toUpperCase();
                if (k.length === 1 && k >= 'A' && k <= 'Z') pressLetter(k);
            }
        });

        function pressLetter(letter) {
            if (col >= COLS || row >= MAX_ROWS) return;
            board[row][col] = letter;
            updateCell(row, col, letter);
            col++;
        }
        function backspace() {
            if (col <= 0) return;
            col--;
            board[row][col] = '';
            updateCell(row, col, '');
        }
        function updateCell(r, c, val) {
            const sel = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if (!sel) return;
            if ('' == val) { sel.removeChild(sel.firstChild); return; }

            const k = document.createElement('img');
            k.src = `assets/${val}.png`;
            k.width = imageSize;
            k.height = imageSize;
            sel.appendChild(k);

        }

        function submit() {

            if (col !== COLS) {
                if (statusEl === null) return;
                statusEl.textContent = "Preencha 5 letras."; return;
            }
            const guess = board[row].join('');


            const target = TARGET;
            const result = Array(COLS).fill('dark');
            const tArr = target.split('');

            console.log({ row, col, guess, target, result, tArr });
            for (let i = 0; i < COLS; i++) {
                const guessEl = guess[i];
                const tArrEl = tArr[i];
                console.log({ guessEl, tArrEl });
                if (guess[i] === tArr[i]) {
                    console.log('green', i, guess[i]);
                    result[i] = 'green'; tArr[i] = null;
                }
            }
            console.log({ row, col, guess, target, result, tArr });
            for (let i = 0; i < COLS; i++) {
                if (result[i] === 'green') continue;
                const idx = tArr.indexOf(guess[i]);
                if (idx > -1) { result[i] = 'yellow'; tArr[idx] = null; }
            }
            for (let i = 0; i < COLS; i++) {
                const cell = document.querySelector(`.cell[data-r="${row}"][data-c="${i}"]`);
                cell.classList.add(result[i]);
                const key = Array.from(document.querySelectorAll('.key')).find(x => x.textContent === guess[i]);
                if (key) {
                    if (key.classList.contains('green')) { }
                    else if (key.classList.contains('yellow') && result[i] === 'dark') { }
                    else { key.classList.remove('dark', 'yellow', 'green'); key.classList.add(result[i]); }
                }
            }
            if (guess === TARGET) {
                if (statusEl !== null) statusEl.textContent = `Parabéns! A palavra do dia era "${TARGET}".`;

                row = MAX_ROWS; return;
            }
            row++; col = 0;
            if (statusEl !== null) {
                if (row >= MAX_ROWS) {
                    statusEl.textContent = `Fim! A palavra era "${TARGET}".`;
                } else {
                    statusEl.textContent = `Tentativa ${row + 1} de ${MAX_ROWS}.`;
                }
            }
        }
        function resetGame() {
            row = 0; col = 0; TARGET = getWordOfDay();
            for (let r = 0; r < MAX_ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = '';
                    const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
                    cell.textContent = ''; cell.className = 'cell';
                }
            }
            Array.from(document.querySelectorAll('.key')).forEach(k => k.className = 'key');
            statusEl.textContent = 'Novo jogo iniciado!';
        }
    </script>
</body>

</html>
